<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>第四課・練習一：句子擴寫（嚴格檢查版）</title>
  <style>
    :root{
      --card:#ffffff;
      --bg:#5f89b2;
      --bg2:#486f96;
      --ink:#050f1c;
      --muted:#20384d;
      --brand:#0f172a;
      --accent:#082f49;
      --line:#3f6a8f;
      --soft:#c5d9ea;

      --good:#16a34a;
      --bad:#dc2626;
      --info:#0b3a66;
      --warn:#b45309;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(180deg, var(--bg2), var(--bg));
      color: var(--ink);
    }
    .wrap{ max-width: 980px; margin:0 auto; padding:20px; }

    .header{
      display:flex; align-items:flex-start; justify-content:space-between;
      gap:12px; flex-wrap:wrap; margin-bottom:14px;
    }
    .title{ font-size:26px; font-weight:950; margin:0; }
    .subtitle{
      font-size:15px; font-weight:850; color:var(--muted);
      margin-top:6px; line-height:1.5;
    }
    .stats{ display:flex; gap:10px; flex-wrap:wrap; }
    .pill{
      background:#f1f5f9;
      border:1px solid var(--line);
      padding:6px 10px;
      border-radius:999px;
      font-weight:950;
      color:#0b2239;
    }
    .badge{
      display:inline-block;
      margin-left:8px;
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:950;
      background:#fde68a;
      border:1px solid #f59e0b;
      color:#7c2d12;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:20px;
      padding:18px;
      box-shadow:0 16px 40px rgba(2,48,96,.35);
    }

    .qno{ font-weight:950; color:var(--accent); margin-bottom:6px; }
    .question{ font-size:18px; font-weight:950; margin: 0 0 10px; line-height:1.55; }

    .hintBox{
      background: #eff6ff;
      border:1px solid #bfdbfe;
      color: var(--info);
      padding:12px 14px;
      border-radius:14px;
      font-weight:900;
      line-height:1.45;
      margin-bottom:12px;
    }
    .hintBox .en{
      display:block;
      margin-top:6px;
      font-size:12px;
      font-weight:850;
      color:#315a7d;
    }

    textarea{
      width:100%;
      min-height:100px;
      resize:vertical;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--line);
      font-size:16px;
      font-weight:850;
      line-height:1.65;
      outline:none;
    }
    textarea:focus{
      border-color:#93c5fd;
      box-shadow: 0 0 0 3px rgba(147,197,253,.35);
    }

    .mini{
      font-size:12px;
      color:var(--muted);
      font-weight:850;
      margin-top:6px;
      line-height:1.4;
    }

    .feedback{
      margin-top:12px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--line);
      display:none;
      font-weight:950;
      line-height:1.5;
      white-space:pre-line;
    }
    .feedback.ok{ display:block; background:#f0fdf4; color:#166534; border-color:#bbf7d0; }
    .feedback.no{ display:block; background:#fef2f2; color:#991b1b; border-color:#fecaca; }
    .feedback.info{ display:block; background:#eff6ff; color:#0b3a66; border-color:#bfdbfe; }

    .actions{
      margin-top:14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .btn{
      padding:12px 16px;
      border-radius:14px;
      border:1px solid var(--line);
      background:var(--brand);
      color:#fff;
      font-weight:950;
      cursor:pointer;
    }
    .btn.secondary{ background:#fff; color:var(--brand); }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }

    /* Modal */
    .overlay{
      position:fixed; inset:0;
      background: rgba(2, 16, 34, .55);
      display:none;
      align-items:center; justify-content:center;
      padding:16px;
      z-index:9999;
    }
    .modal{
      width:min(820px, 100%);
      background:#fff;
      border-radius:18px;
      border:1px solid var(--line);
      box-shadow:0 24px 70px rgba(0,0,0,.28);
      overflow:hidden;
    }
    .modalHead{
      padding:14px 16px;
      background: linear-gradient(180deg, #f1f5f9, #ffffff);
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    .modalTitle{
      font-weight:950;
      font-size:18px;
      color: var(--accent);
      line-height:1.25;
    }
    .modalClose{
      border:1px solid var(--line);
      background:#fff;
      border-radius:12px;
      padding:10px 12px;
      font-weight:950;
      cursor:pointer;
    }
    .modalBody{
      padding:14px 16px 16px;
      line-height:1.7;
      font-weight:850;
      color:#0b2239;
    }
    .gBlock{
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px 12px;
      background:#f8fafc;
      margin-top:10px;
    }
    .gLabel{
      font-weight:950;
      color:#0b3a66;
      margin-bottom:4px;
    }
    .gEn{
      font-size:13px;
      color:#315a7d;
      font-weight:850;
      margin-top:6px;
    }

    @media (max-width:600px){
      .wrap{ padding:14px; }
      .title{ font-size:24px; }
      textarea{ font-size:18px; min-height:130px; }
      .btn{ width:100%; }
      .actions{ justify-content:stretch; }
    }
  </style>
</head>

<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1 class="title">
        第四課・練習一：句子擴寫
        <span class="badge">嚴格檢查 Strict</span>
      </h1>
      <div class="subtitle">
        需通過：①語法結構 ②語意合理（明顯不通判錯）③標點正確（逗號/句末）<br>
        <span style="font-size:13px; color:#314e68;">
          Must pass: (1) grammar structure (2) obvious meaning issues (3) punctuation (comma & sentence-final mark).
        </span>
      </div>
    </div>

    <div class="stats">
      <span class="pill">進度：<span id="progress">1/4</span></span>
      <span class="pill">通過：<span id="passed">0</span></span>
    </div>
  </div>

  <div class="card" id="card"></div>
</div>

<!-- Grammar Modal -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal">
    <div class="modalHead">
      <div class="modalTitle" id="modalTitle">語法說明</div>
      <button class="modalClose" id="modalClose">關閉 Close</button>
    </div>
    <div class="modalBody" id="modalBody"></div>
  </div>
</div>

<script>
  // ===== Helper: safer replace (no replaceAll) =====
  function escapeHTML(str){
    return String(str ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  // For checking: keep punctuation but normalize spaces
  function normalizeRaw(str){
    return String(str ?? "")
      .replace(/\u00A0/g, " ")
      .replace(/[ \t]+/g, " ")
      .trim();
  }

  // For keyword include checks: remove spaces only
  function stripSpaces(str){
    return String(str ?? "").replace(/\s+/g, "");
  }

  function hasSentenceFinalPunct(s){
    // Accept Chinese or English sentence-final punctuation
    return /[。！？!?]$/.test(s);
  }

  function hasAnyWeirdControlChar(s){
    // Common invisible control chars that break scripts or display
    return /[\u200B\u200C\u200D\uFEFF]/.test(s);
  }

  // ===== Grammar explanations (中英＋例句) =====
  const GRAMMAR_INFO = {
    yushi: {
      title: "於是",
      zh: "用法：表示「所以」「因此」。前面通常有原因或情況，後面是結果。",
      en: "Usage: shows a result/consequence, like “so/therefore”. Usually follows a cause/situation.",
      exZh: "他努力思考，於是解決了問題。",
      exEn: "He thought carefully, so he solved the problem."
    },
    jingguo: {
      title: "經過",
      zh: "用法：表示「在某時間後／經歷某過程後」再出現結果。可接「努力、時間、討論…」。",
      en: "Usage: “after going through a process / after a period of time”, then comes a result.",
      exZh: "經過努力，他們完成了任務。",
      exEn: "After hard work, they completed the task."
    },
    lingwai: {
      title: "另外",
      zh: "用法：補充說明，表示「而且／此外」。常放句首：另外，……",
      en: "Usage: adds extra information (“in addition/besides”). Often at the beginning: “另外， …”",
      exZh: "另外，她提出了一個新的想法。",
      exEn: "In addition, she suggested a new idea."
    },
    jishi: {
      title: "即使…也…",
      zh: "用法：表示「條件不影響結果」＝就算…，結果仍不變。",
      en: "Usage: “even if …, still …” the result does not change despite the condition.",
      exZh: "即使遇到困難，他也沒有放棄。",
      exEn: "Even if he faced difficulties, he still did not give up."
    }
  };

  // ===== Strict checking rules =====
  // We keep checks explainable (rule-based), not black-box.
  const GLOBAL_STRICT_RULES = [
    {
      id: "no-empty",
      zh: "必要：請先輸入句子。",
      en: "Required: Please type a sentence.",
      testFail: s => !s
    },
    {
      id: "no-weird-chars",
      zh: "必要：句子包含看不見的特殊字元（請手動重新打一遍）。",
      en: "Required: Your sentence contains invisible special characters. Please retype it.",
      testFail: s => hasAnyWeirdControlChar(s)
    },
    {
      id: "final-punct",
      zh: "必要：句末需要句號或問號/驚嘆號（例如：。！？）。",
      en: "Required: Add a sentence-final mark (e.g., 。！？ or .!? ).",
      testFail: s => !hasSentenceFinalPunct(s)
    },
    {
      id: "no-double-connectors",
      zh: "語意：連接詞重複使用（如「於是所以」「因為所以於是」），會讓語意不通或冗贅。",
      en: "Meaning: duplicated connectors (e.g., “於是所以”, “因為所以於是”) make it unclear or redundant.",
      testFail: s => /(於是所以|所以於是|因為所以於是|因為於是所以)/.test(s)
    }
  ];

  // ===== Questions =====
  const QUESTIONS = [
    {
      id: 1,
      base: "他沒有放棄。",
      grammarKey: "jishi",
      grammarName: "即使…也…",
      mustInclude: ["放棄"],
      mustCommaPattern: /即使.+[，,].+也/,
      required: [
        { zh:"必要：需出現「即使」。", en:"Required: Must include “即使”.", fail: s => !s.includes("即使") },
        { zh:"必要：需出現「也」。", en:"Required: Must include “也”.", fail: s => !s.includes("也") },
        { zh:"必要：「即使」在前，「也」在後。", en:"Required: “即使” should come before “也”.", fail: s => s.includes("即使") && s.includes("也") && (s.indexOf("即使") > s.lastIndexOf("也")) },
        { zh:"標點：嚴格模式下「即使…，…也…」中間必須有逗號。", en:"Punctuation (strict): Use a comma in “即使…，…也…”.", fail: s => /即使.+也/.test(s) && !/即使.+[，,].+也/.test(s) }
      ],
      semanticFails: [
        {
          zh:"語意：用了「即使…也…」但句子像在表示因果（例如「下雨了，於是…」），容易衝突。請改成「就算…仍然…」。",
          en:"Meaning: “即使…也…” should show ‘despite’. Avoid turning it into a cause-result sentence. Use ‘even if…, still…’ clearly.",
          fail: s => /即使.+(所以|因此|於是)/.test(s)
        },
        {
          zh:"語意：條件句缺少具體內容（例如只寫「即使很…」但結果太不清楚）。請補充更完整。",
          en:"Meaning: The condition/result is too vague. Add clearer content.",
          fail: s => /即使(很|太)?[，,].*也[，,。！？!?]?$/.test(s)
        }
      ],
      sample: "即使很困難，他也沒有放棄。"
    },

    {
      id: 2,
      base: "他們完成任務。",
      grammarKey: "jingguo",
      grammarName: "經過",
      mustInclude: ["完成","任務"],
      required: [
        { zh:"必要：需出現「經過」。", en:"Required: Must include “經過”.", fail: s => !s.includes("經過") },
        { zh:"必要：「經過」後面需要接「過程/時間」（如：經過努力／經過一段時間）。", en:"Required: After “經過”, add a process/time (e.g., 經過努力 / 經過一段時間).",
          fail: s => s.includes("經過") && !/經過.{1,10}(努力|討論|時間|訓練|準備|研究|協調|一段|多次|這件事|這段時間)/.test(s)
        },
        { zh:"標點：嚴格模式下「經過…，…」建議必須用逗號分開。", en:"Punctuation (strict): Use a comma in “經過…，…”.",
          fail: s => s.includes("經過") && !/經過.+[，,]/.test(s)
        }
      ],
      semanticFails: [
        {
          zh:"語意：「經過」後面不應直接接結果動作（例如「經過完成任務」）。要先是過程，再是結果。",
          en:"Meaning: After “經過”, do not put the result action directly (e.g., 經過完成…). Put the process first, then the result.",
          fail: s => /經過(完成|完成了|達成|做完)/.test(s)
        }
      ],
      sample: "經過努力，他們完成了任務。"
    },

    {
      id: 3,
      base: "他解決了問題。",
      grammarKey: "yushi",
      grammarName: "於是",
      mustInclude: ["解決","問題"],
      required: [
        { zh:"必要：需出現「於是」。", en:"Required: Must include “於是”.", fail: s => !s.includes("於是") },
        { zh:"必要：「於是」前面要有原因/情況（不可只寫「於是…」）。", en:"Required: Put a cause/situation before “於是” (don’t start with only “於是…”).",
          fail: s => s.startsWith("於是")
        },
        { zh:"標點：嚴格模式下，原因與結果之間必須用逗號（…，於是…）。", en:"Punctuation (strict): Use a comma before “於是” (…，於是…).",
          fail: s => s.includes("於是") && !/[，,].*於是/.test(s)
        }
      ],
      semanticFails: [
        {
          zh:"語意：不要把「於是」用成並列（像「他努力，於是也…」但結果不明）。請確保後面是明確結果。",
          en:"Meaning: Make sure what follows “於是” is a clear result, not a vague continuation.",
          fail: s => /於是(也)?[，,。！？!?]?$/.test(s)
        }
      ],
      sample: "他努力思考，於是解決了問題。"
    },

    {
      id: 4,
      base: "她提出一個想法。",
      grammarKey: "lingwai",
      grammarName: "另外",
      mustInclude: ["提出","想法"],
      required: [
        { zh:"必要：需出現「另外」。", en:"Required: Must include “另外”.", fail: s => !s.includes("另外") },
        { zh:"標點：嚴格模式下「另外」放句首必須加逗號（另外，…）。", en:"Punctuation (strict): If “另外” is at the beginning, add a comma (另外，…).",
          fail: s => s.startsWith("另外") && !/^另外[，,]/.test(s)
        }
      ],
      semanticFails: [
        {
          zh:"語意：「另外」是補充，不表示因果結果；不要把它當成「所以/於是」。",
          en:"Meaning: “另外” adds information; it is not a cause→result connector like “so/therefore”.",
          fail: s => /另外.*(所以|因此|於是)/.test(s)
        }
      ],
      sample: "另外，她提出了一個新的想法。"
    }
  ];

  // ===== UI / state =====
  let idx = 0;
  let passedCount = 0;

  const card = document.getElementById("card");
  const progressEl = document.getElementById("progress");
  const passedEl = document.getElementById("passed");

  // Modal
  const overlay = document.getElementById("overlay");
  const modalTitle = document.getElementById("modalTitle");
  const modalBody = document.getElementById("modalBody");
  const modalClose = document.getElementById("modalClose");

  function openModal(grammarKey){
    const g = GRAMMAR_INFO[grammarKey];
    if(!g) return;

    modalTitle.textContent = `語法說明｜${g.title} (Grammar)`;
    modalBody.innerHTML = `
      <div class="gBlock">
        <div class="gLabel">中文說明</div>
        <div>${escapeHTML(g.zh)}</div>
      </div>

      <div class="gBlock">
        <div class="gLabel">English Explanation</div>
        <div class="gEn">${escapeHTML(g.en)}</div>
      </div>

      <div class="gBlock">
        <div class="gLabel">例句 / Example</div>
        <div><b>${escapeHTML(g.exZh)}</b></div>
        <div class="gEn"><b>${escapeHTML(g.exEn)}</b></div>
      </div>
    `;
    overlay.style.display = "flex";
    overlay.setAttribute("revealed", "true");
  }

  function closeModal(){
    overlay.style.display = "none";
    overlay.removeAttribute("revealed");
  }

  modalClose.onclick = closeModal;
  overlay.addEventListener("click", (e)=>{ if(e.target === overlay) closeModal(); });
  document.addEventListener("keydown", (e)=>{ if(e.key === "Escape" && overlay.getAttribute("revealed")) closeModal(); });

  function includesAllKeywords(noSpaceStr, words){
    return words.every(w => noSpaceStr.includes(w));
  }

  function evaluateStrict(q, rawInput){
    const raw = normalizeRaw(rawInput);
    const noSpace = stripSpaces(raw);

    const fails = []; // each: {type, zh, en}
    const bonus = [];

    // Global strict rules
    GLOBAL_STRICT_RULES.forEach(rule=>{
      try{
        if(rule.testFail(raw)){
          fails.push({ type:"global", zh: rule.zh, en: rule.en });
        }
      }catch(e){
        fails.push({ type:"global", zh:"必要：檢查時發生錯誤，請改寫句子再試一次。", en:"Required: An error occurred during checking. Please revise and try again." });
      }
    });

    // Keyword (topic relevance)
    if(raw && !includesAllKeywords(noSpace, q.mustInclude)){
      fails.push({
        type:"keyword",
        zh:`必要：句子需包含重點詞：${q.mustInclude.join("、")}。`,
        en:`Required: Your sentence must include key words: ${q.mustInclude.join(", ")}.`
      });
    }

    // Grammar + punctuation required
    q.required.forEach(r=>{
      try{
        if(raw && r.fail(raw)){
          fails.push({ type:"required", zh: r.zh, en: r.en });
        }
      }catch(e){
        fails.push({ type:"required", zh:"必要：語法檢查出錯，請改寫再試。", en:"Required: Grammar check failed due to an error. Please rewrite." });
      }
    });

    // Meaning checks (obvious issues only)
    q.semanticFails.forEach(r=>{
      try{
        if(raw && r.fail(raw)){
          fails.push({ type:"semantic", zh: r.zh, en: r.en });
        }
      }catch(e){}
    });

    // Simple “style bonus” (optional)
    // Reward clear comma usage for target patterns
    if(q.grammarKey === "jishi" && /即使.+[，,].+也/.test(raw)) bonus.push("comma-good");
    if(q.grammarKey === "jingguo" && /經過.+[，,]/.test(raw)) bonus.push("comma-good");
    if(q.grammarKey === "yushi" && /[，,].*於是/.test(raw)) bonus.push("comma-good");
    if(q.grammarKey === "lingwai" && /^另外[，,]/.test(raw)) bonus.push("comma-good");

    const pass = fails.length === 0;

    return { pass, fails, raw, bonus };
  }

  function render(){
    const q = QUESTIONS[idx];
    progressEl.textContent = `${q.id}/${QUESTIONS.length}`;
    passedEl.textContent = String(passedCount);

    card.innerHTML = `
      <div class="qno">第 ${q.id} 題｜加入「${escapeHTML(q.grammarName)}」</div>
      <div class="question">原句：${escapeHTML(q.base)}</div>

      <div class="hintBox">
        <div><b>嚴格模式通過條件：</b></div>
        <div style="margin-top:6px;">
          ① 使用指定語法：<b>${escapeHTML(q.grammarName)}</b><br>
          ② 句子需包含重點詞：<b>${escapeHTML(q.mustInclude.join("、"))}</b><br>
          ③ 標點需正確（逗號/句末標點）<br>
          ④ 明顯語意不通（錯搭配/因果衝突）會判錯
        </div>
        <span class="en">
          Strict pass: grammar + key words + punctuation + no obvious meaning issues.
        </span>
      </div>

      <textarea id="answer" placeholder="請在這裡輸入你的句子…（句末記得加 。！？）"></textarea>
      <div class="mini">
        嚴格模式：少逗號、少句號、明顯不通都會判錯。Strict mode: comma/final mark/obvious meaning issues are required.
      </div>

      <div id="feedback" class="feedback info" style="display:block;">
        先輸入句子，再按「檢查」。<br>
        Type your sentence, then click “Check”.
      </div>

      <div class="actions">
        <button class="btn secondary" id="grammarBtn">查看語法 View Grammar</button>
        <button class="btn secondary" id="sampleBtn">填入範例 Sample</button>
        <button class="btn secondary" id="clearBtn">清空 Clear</button>
        <button class="btn" id="checkBtn">檢查 Check</button>
        <button class="btn" id="nextBtn" disabled>${q.id === QUESTIONS.length ? "完成 Finish" : "下一題 Next"}</button>
      </div>
    `;

    const $answer = document.getElementById("answer");
    const $fb = document.getElementById("feedback");
    const $next = document.getElementById("nextBtn");

    document.getElementById("grammarBtn").onclick = () => openModal(q.grammarKey);

    document.getElementById("sampleBtn").onclick = () => {
      $answer.value = q.sample;
      $fb.className = "feedback info";
      $fb.style.display = "block";
      $fb.textContent = "已填入範例。你可以直接檢查，或改寫再檢查。\nSample inserted. You can check it or rewrite it.";
      $next.disabled = true;
      delete $next.dataset.passed;
    };

    document.getElementById("clearBtn").onclick = () => {
      $answer.value = "";
      $fb.className = "feedback info";
      $fb.style.display = "block";
      $fb.textContent = "已清空，請重新輸入句子。\nCleared. Please type a new sentence.";
      $next.disabled = true;
      delete $next.dataset.passed;
    };

    document.getElementById("checkBtn").onclick = () => {
      const raw = $answer.value;
      const res = evaluateStrict(q, raw);

      if(!res.pass){
        $fb.className = "feedback no";
        $fb.style.display = "block";

        const zhLines = res.fails.map(x => `- ${x.zh}`).join("\n");
        const enLines = res.fails.map(x => `- ${x.en}`).join("\n");

        $fb.textContent =
          `❌ 未通過（嚴格模式）\n❌ Not Passed (Strict Mode)\n\n【中文原因】\n${zhLines}\n\n【English Reasons】\n${enLines}\n\n你的句子：${res.raw || "（空白）"}\n參考範例：${q.sample}`;
        $next.disabled = true;
        delete $next.dataset.passed;
        return;
      }

      // passed
      if(!$next.dataset.passed){
        passedCount++;
        passedEl.textContent = String(passedCount);
        $next.dataset.passed = "1";
      }

      let msg =
        `✅ 通過！（嚴格模式）\n✅ Passed! (Strict Mode)\n\n你的句子：${res.raw}\n`;

      if(res.bonus.length){
        msg += `\n🌟 加分點 Bonus\n- 逗號/結構使用自然。\n- Comma/structure is natural.\n`;
      }else{
        msg += `\n🌟 加分點 Bonus\n（沒有加分點，但已經完全正確。）\n(No bonus points, but it is fully correct.)\n`;
      }

      $fb.className = "feedback ok";
      $fb.style.display = "block";
      $fb.textContent = msg;

      $next.disabled = false;
    };

    $next.onclick = () => {
      if(idx < QUESTIONS.length - 1){
        idx++;
        render();
      }else{
        card.innerHTML = `
          <div class="feedback ok" style="display:block;">
            🎉 你已完成第四課練習一（嚴格檢查版）！<br>
            ✅ 通過題數：${passedCount} / ${QUESTIONS.length}<br><br>
            建議：再練一次，試著寫得更自然、內容更完整。
            <div style="margin-top:6px; font-size:13px; font-weight:850;">
              Tip: Try again and make your sentence more natural and complete.
            </div>
          </div>
          <div class="actions" style="justify-content:flex-end; margin-top:12px;">
            <button class="btn secondary" id="againBtn">再練一次 Practice Again</button>
            <button class="btn" id="grammarBankBtn">查看語法 View Grammar</button>
          </div>
        `;
        document.getElementById("againBtn").onclick = () => {
          idx = 0;
          passedCount = 0;
          render();
        };
        document.getElementById("grammarBankBtn").onclick = () => openModal("jishi");
      }
    };
  }

  render();
</script>
</body>
</html>
