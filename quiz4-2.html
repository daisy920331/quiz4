<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>第四課・練習二：語意判斷（可以/不可以）</title>
  <style>
    :root{
      /* Lesson 4 – 深色系 */
      --card:#ffffff;
      --bg:#5f89b2;
      --bg2:#486f96;
      --ink:#050f1c;
      --muted:#20384d;
      --brand:#0f172a;
      --accent:#082f49;
      --line:#3f6a8f;
      --soft:#c5d9ea;

      --good:#16a34a;
      --bad:#dc2626;
      --info:#0b3a66;
      --warn:#b45309;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(180deg, var(--bg2), var(--bg));
      color: var(--ink);
    }
    .wrap{ max-width: 980px; margin:0 auto; padding:20px; }

    .header{
      display:flex; align-items:flex-start; justify-content:space-between;
      gap:12px; flex-wrap:wrap; margin-bottom:14px;
    }
    .title{ font-size:26px; font-weight:950; margin:0; }
    .subtitle{
      font-size:15px; font-weight:850; color:var(--muted);
      margin-top:6px; line-height:1.5;
    }
    .stats{ display:flex; gap:10px; flex-wrap:wrap; }
    .pill{
      background:#f1f5f9;
      border:1px solid var(--line);
      padding:6px 10px;
      border-radius:999px;
      font-weight:950;
      color:#0b2239;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:20px;
      padding:18px;
      box-shadow:0 16px 40px rgba(2,48,96,.35);
    }

    .qno{ font-weight:950; color:var(--accent); margin-bottom:6px; }
    .prompt{
      font-weight:950;
      line-height:1.7;
      margin: 0 0 10px;
    }
    .pair{
      border:1px solid var(--line);
      border-radius:16px;
      background:var(--soft);
      padding:12px 14px;
      font-weight:900;
      line-height:1.8;
    }
    .pair .arrow{ opacity:.9; }
    .pair .s{ margin:0; }
    .pair b{ color: var(--accent); }

    .judgeRow{
      display:flex;
      gap:10px;
      margin-top:12px;
      flex-wrap:wrap;
    }
    .judgeBtn{
      flex:1;
      text-align:center;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#fff;
      font-weight:950;
      cursor:pointer;
      transition:.15s;
      user-select:none;
    }
    .judgeBtn:hover{ border-color:#93c5fd; background:#f8fafc; }
    .judgeBtn:disabled{ opacity:.75; cursor:not-allowed; }

    .judgeBtn.okPick{ border-color: var(--good); box-shadow: 0 0 0 3px rgba(22,163,74,.18); }
    .judgeBtn.noPick{ border-color: var(--bad); box-shadow: 0 0 0 3px rgba(220,38,38,.18); }

    .feedback{
      margin-top:12px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--line);
      display:none;
      font-weight:950;
      line-height:1.55;
      white-space:pre-line;
    }
    .feedback.ok{ display:block; background:#f0fdf4; color:#166534; border-color:#bbf7d0; }
    .feedback.no{ display:block; background:#fef2f2; color:#991b1b; border-color:#fecaca; }
    .feedback.info{ display:block; background:#eff6ff; color:#0b3a66; border-color:#bfdbfe; }

    .actions{
      margin-top:14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .btn{
      padding:12px 16px;
      border-radius:14px;
      border:1px solid var(--line);
      background:var(--brand);
      color:#fff;
      font-weight:950;
      cursor:pointer;
    }
    .btn.secondary{ background:#fff; color:var(--brand); }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }

    /* Modal */
    .overlay{
      position:fixed; inset:0;
      background: rgba(2, 16, 34, .55);
      display:none;
      align-items:center; justify-content:center;
      padding:16px;
      z-index:9999;
    }
    .modal{
      width:min(820px, 100%);
      background:#fff;
      border-radius:18px;
      border:1px solid var(--line);
      box-shadow:0 24px 70px rgba(0,0,0,.28);
      overflow:hidden;
    }
    .modalHead{
      padding:14px 16px;
      background: linear-gradient(180deg, #f1f5f9, #ffffff);
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    .modalTitle{
      font-weight:950;
      font-size:18px;
      color: var(--accent);
      line-height:1.25;
    }
    .modalClose{
      border:1px solid var(--line);
      background:#fff;
      border-radius:12px;
      padding:10px 12px;
      font-weight:950;
      cursor:pointer;
    }
    .modalBody{
      padding:14px 16px 16px;
      line-height:1.7;
      font-weight:850;
      color:#0b2239;
    }
    .gBlock{
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px 12px;
      background:#f8fafc;
      margin-top:10px;
    }
    .gLabel{
      font-weight:950;
      color:#0b3a66;
      margin-bottom:4px;
    }
    .gEn{
      font-size:13px;
      color:#315a7d;
      font-weight:850;
      margin-top:6px;
    }

    @media (max-width:600px){
      .wrap{ padding:14px; }
      .title{ font-size:24px; }
      .judgeBtn{ padding:16px 14px; font-size:18px; }
      .btn{ width:100%; }
      .actions{ justify-content:stretch; }
    }
  </style>
</head>

<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1 class="title">第四課・練習二：語意判斷</h1>
      <div class="subtitle">
        請判斷兩句話語意是否能互換，並選「可以 / 不可以」。<br>
        <span style="font-size:13px; color:#314e68;">
          Decide whether the two sentences are interchangeable in meaning. Choose “OK / Not OK”.
        </span>
      </div>
    </div>

    <div class="stats">
      <span class="pill">分數：<span id="score">0</span></span>
      <span class="pill">進度：<span id="progress">0/0</span></span>
    </div>
  </div>

  <div class="card" id="card"></div>
</div>

<!-- Grammar Modal -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal">
    <div class="modalHead">
      <div class="modalTitle" id="modalTitle">語法說明</div>
      <button class="modalClose" id="modalClose">關閉 Close</button>
    </div>
    <div class="modalBody" id="modalBody"></div>
  </div>
</div>

<script>
  // ===== Grammar explanations (中英＋例句) =====
  const GRAMMAR_INFO = {
    yushi: {
      title: "於是",
      zh: "用法說明：表示「所以」「因此」。常用在因果關係，前面通常有原因或情況。",
      en: "Usage: “於是” shows a result or consequence, similar to “so / therefore”. It often follows a cause or situation.",
      tipZh: "常用在因果關係，常與「因為」搭配。",
      tipEn: "Often used in cause-and-effect. It can be used with “because”.",
      exZh: "他努力思考，於是解決了問題。",
      exEn: "He thought carefully, so he solved the problem."
    },
    jingguo: {
      title: "經過",
      zh: "用法說明：表示「在某時間後，有新狀況」，也可表示「經歷一個過程」。這裡是介詞用法。",
      en: "Usage: “經過” means “after going through a process / after a period of time”. It often introduces a process or experience.",
      tipZh: "有動詞、名詞介詞的用法；這裡是介詞。",
      tipEn: "It can act like a verb or a preposition; here it works as a preposition.",
      exZh: "經過這件事，水慢慢退去。",
      exEn: "After this event, the water slowly went down."
    },
    lingwai: {
      title: "另外",
      zh: "用法說明：用於補充說明，表示「而且」「別的」。",
      en: "Usage: “另外” adds extra information, similar to “in addition / besides”.",
      tipZh: "用於補充說明或另一個事物的意思。",
      tipEn: "Used to add extra information or introduce another point.",
      exZh: "另外，她提出了一個新的想法。",
      exEn: "In addition, she suggested a new idea."
    },
    jishi: {
      title: "即使…也…",
      zh: "用法說明：表示「假設某事發生，結果不變」。",
      en: "Usage: “即使…也…” shows that the result does not change even if a condition happens. Similar to “even if … still …”.",
      tipZh: "雖然是已知事實，即使是可能性，結果都不變。",
      tipEn: "Whether it is a fact or a possibility, the result remains the same.",
      exZh: "即使遇到困難，他也沒有放棄。",
      exEn: "Even if he faced difficulties, he still did not give up."
    }
  };

  // ===== Questions from your image =====
  // answer: true = 可以 (interchangeable), false = 不可以 (not interchangeable)
 const QUESTIONS = [
  {
    id: 1,
    g: [],
    a: "他們想在河邊建立一座小橋。",
    b: "他們想在河邊堵住一座小橋。",
    answer: false,
    explainZh: `「建立」是建造／設立（build/establish），可以用在「建立一座小橋」這種建造行為。但「堵住」是把通道塞住、阻擋（block/stop up），意思會變成「把一座小橋堵住」，語意不合，也不自然。
所以兩句不能互換。`,
    explainEn: `“建立” means to build/establish, so it works for “建立一座小橋.”
However, “堵住” means to block/stop up a passage, which would make the sentence mean “to block a bridge,” which is unnatural and changes the meaning.
So the two sentences are not interchangeable.`
  },
  {
    id: 2,
    g: ["yushi","lingwai"],
    a: "他完成工作，於是回家休息。",
    b: "他完成工作，另外回家休息。",
    answer: false,
    explainZh: `「於是」表示因果結果：完成工作 → 回家休息。
「另外」是補充資訊，不表示結果，因此語意不同，不能互換。`,
    explainEn: `“於是” shows cause → result: finished work → went home to rest.
“另外” adds extra information and does not show a result, so they are not interchangeable.`
  },
  {
    id: 3,
    g: [],
    a: "他承諾會完成這份工作。",
    b: "他答應會完成這份工作。",
    answer: true,
    explainZh: `「承諾」和「答應」都表示同意並願意做某事，這裡語意相近，可以互換（語氣上「承諾」更正式）。`,
    explainEn: `Both “承諾” and “答應” mean agreeing to do something.
Here they are close in meaning, so they can be interchangeable (“承諾” is more formal).`
  },
  {
    id: 4,
    g: ["jishi","yushi"],
    a: "即使下雨，我們也出門了。",
    b: "下雨了，於是我們出門了。",
    answer: false,
    explainZh: `「即使…也…」表示條件不影響結果（仍然出門）。
「於是」表示因果結果（因為下雨所以出門）語意反而怪，所以不能互換。`,
    explainEn: `“即使…也…” means the result stays the same despite the condition (still went out).
“於是” means cause → result (“because it rained, so we went out”), which is odd here.
Not interchangeable.`
  }
];

  // ===== State =====
  let deck = [];
  let idx = 0;
  let score = 0;
  let locked = false;

  const $card = document.getElementById("card");
  const $score = document.getElementById("score");
  const $progress = document.getElementById("progress");

  // Modal
  const overlay = document.getElementById("overlay");
  const modalTitle = document.getElementById("modalTitle");
  const modalBody = document.getElementById("modalBody");
  const modalClose = document.getElementById("modalClose");

  function escapeHTML(str){
    return (str ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#39;");
  }

  function openModal(keys){
    const list = (Array.isArray(keys) ? keys : [keys]).filter(Boolean);
    if(!list.length){
      modalTitle.textContent = "語法說明｜Grammar";
      modalBody.innerHTML = `<div class="gBlock"><div class="gLabel">提示</div><div>此題不指定單一語法重點。</div><div class="gEn">This question does not focus on a single grammar point.</div></div>`;
      overlay.style.display = "flex";
      overlay.setAttribute("revealed", "true");
      return;
    }

    const blocks = list.map(k=>{
      const g = GRAMMAR_INFO[k];
      if(!g) return "";
      return `
        <div class="gBlock">
          <div class="gLabel">${escapeHTML(g.title)}</div>
          <div>${escapeHTML(g.zh)}</div>
          <div class="gEn">${escapeHTML(g.en)}</div>
          <div style="margin-top:8px;"><b>例句：</b>${escapeHTML(g.exZh)}</div>
          <div class="gEn"><b>Example:</b> ${escapeHTML(g.exEn)}</div>
        </div>
      `;
    }).join("");

    modalTitle.textContent = "語法說明｜Grammar";
    modalBody.innerHTML = blocks || `<div class="gBlock">（沒有資料）</div>`;
    overlay.style.display = "flex";
    overlay.setAttribute("revealed", "true");
  }

  function closeModal(){
    overlay.style.display = "none";
    overlay.removeAttribute("revealed");
  }

  modalClose.onclick = closeModal;
  overlay.addEventListener("click", (e)=>{ if(e.target === overlay) closeModal(); });
  document.addEventListener("keydown", (e)=>{ if(e.key === "Escape" && overlay.getAttribute("revealed")) closeModal(); });

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function reset(){
    deck = shuffle(QUESTIONS);
    idx = 0;
    score = 0;
    locked = false;
    $score.textContent = score;
    $progress.textContent = `0/${deck.length}`;
    renderStart();
  }

  function renderStart(){
    $card.innerHTML = `
      <div class="feedback info" style="display:block;">
        規則：看兩句話，判斷語意能不能互換。<br>
        <b>可以</b>＝語意相近，可互換；<b>不可以</b>＝語意不同或不自然。<br><br>
        <span style="font-size:13px; font-weight:850; color:#315a7d;">
          Rule: Decide if the meanings are interchangeable. OK = similar meaning; Not OK = different/unnatural.
        </span>
      </div>

      <div class="actions" style="justify-content:flex-end;">
        <button class="btn secondary" id="reshuffleBtn">重新洗牌 Reshuffle</button>
        <button class="btn" id="startBtn">開始 Start</button>
      </div>
    `;
    document.getElementById("reshuffleBtn").onclick = () => {
      deck = shuffle(QUESTIONS);
      idx = 0;
      $progress.textContent = `0/${deck.length}`;
      renderStart();
    };
    document.getElementById("startBtn").onclick = renderQuestion;
  }

  function renderQuestion(){
    locked = false;
    const item = deck[idx];
    const qno = idx + 1;
    $progress.textContent = `${qno}/${deck.length}`;

    // Options shuffle: 可以/不可以位置洗牌
    const choices = shuffle([
      { labelZh:"可以", labelEn:"OK", value:true },
      { labelZh:"不可以", labelEn:"Not OK", value:false }
    ]);

    $card.innerHTML = `
      <div class="qno">第 ${qno} 題</div>
      <div class="prompt">請判斷兩句話語意是否能互換：</div>

      <div class="pair">
        <p class="s">① ${escapeHTML(item.a)}</p>
        <p class="s arrow">→</p>
        <p class="s">② ${escapeHTML(item.b)}</p>
      </div>

      <div class="judgeRow">
        ${choices.map((c, i)=>`
          <button class="judgeBtn" data-val="${c.value}">
            ${c.labelZh}
            <div style="font-size:12px; font-weight:850; color:#315a7d; margin-top:4px;">
              ${c.labelEn}
            </div>
          </button>
        `).join("")}
      </div>

      <div id="feedback" class="feedback"></div>

      <div class="actions">
        <button class="btn secondary" id="grammarBtn">查看語法說明 View Grammar</button>
        <button class="btn" id="nextBtn" disabled>${qno === deck.length ? "完成 Finish" : "下一題 Next"}</button>
      </div>
    `;

    const fb = document.getElementById("feedback");
    const nextBtn = document.getElementById("nextBtn");

    document.getElementById("grammarBtn").onclick = () => openModal(item.g);

    document.querySelectorAll(".judgeBtn").forEach(btn=>{
      btn.onclick = ()=>{
        if(locked) return;
        locked = true;

        const picked = (btn.dataset.val === "true");
        const correct = (picked === item.answer);

        // score
        if(correct){
          score += 1;
          $score.textContent = score;
          fb.className = "feedback ok";
          fb.textContent =
            `✅ 正確！\n\n【中文】${item.explainZh}\n\n【English】${item.explainEn}`;
          btn.classList.add("okPick");
        }else{
          fb.className = "feedback no";
          const ansTextZh = item.answer ? "可以" : "不可以";
          const ansTextEn = item.answer ? "OK" : "Not OK";
          fb.textContent =
            `❌ 不正確。\n正確答案：${ansTextZh} (${ansTextEn})\n\n【中文】${item.explainZh}\n\n【English】${item.explainEn}`;
          btn.classList.add("noPick");
        }

        document.querySelectorAll(".judgeBtn").forEach(b=>b.disabled = true);
        nextBtn.disabled = false;
      };
    });

    nextBtn.onclick = ()=>{
      if(idx < deck.length - 1){
        idx++;
        renderQuestion();
      }else{
        renderEnd();
      }
    };
  }

  function renderEnd(){
    $progress.textContent = `${deck.length}/${deck.length}`;
    $card.innerHTML = `
      <div class="feedback ok" style="display:block;">
        🎉 完成第四課練習二！<br>
        得分：<b>${score}</b> / ${deck.length}<br><br>
        <span style="font-size:13px; font-weight:850;">
          Finished! Score: ${score} / ${deck.length}
        </span>
      </div>
      <div class="actions" style="justify-content:flex-end;">
        <button class="btn secondary" id="againBtn">再玩一次 Play Again</button>
      </div>
    `;
    document.getElementById("againBtn").onclick = reset;
  }

  reset();
</script>
</body>
</html>
