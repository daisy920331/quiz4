<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>第四課・練習三：排序＋句意判斷（選句作證據）</title>
  <style>
    :root{
      --bg:#3f5f7f;
      --bg2:#2f4b66;
      --card:#ffffff;
      --ink:#07121f;
      --muted:#2c435c;
      --brand:#0f172a;
      --accent:#083344;
      --line:#587fa1;
      --soft:#d6e6f3;

      --good:#16a34a;
      --bad:#dc2626;
      --info:#0b3a66;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(180deg, var(--bg2), var(--bg));
      color: var(--ink);
    }
    .wrap{ max-width: 980px; margin:0 auto; padding:20px; }

    .header{
      display:flex; align-items:flex-start; justify-content:space-between;
      gap:12px; flex-wrap:wrap; margin-bottom:14px;
    }
    .title{ font-size:26px; font-weight:950; margin:0; }
    .subtitle{
      font-size:15px; font-weight:850; color:var(--muted);
      margin-top:6px; line-height:1.5;
    }
    .stats{ display:flex; gap:10px; flex-wrap:wrap; }
    .pill{
      background:#f1f5f9;
      border:1px solid var(--line);
      padding:6px 10px;
      border-radius:999px;
      font-weight:950;
      color:#0b2239;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:20px;
      padding:18px;
      box-shadow:0 16a0px 40px rgba(0,0,0,.35);
    }

    .blockTitle{
      font-size:18px;
      font-weight:950;
      color:var(--accent);
      margin:0 0 10px;
      line-height:1.3;
    }

    .passage{
      border:1px solid var(--line);
      background:#f8fafc;
      border-radius:16px;
      padding:12px 14px;
      line-height:1.85;
      font-weight:850;
      color:#0b2239;
      white-space:pre-line;
    }

    .divider{ height:1px; background:rgba(88,127,161,.35); margin:16px 0; }

    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; }

    .btn{
      padding:12px 16px;
      border-radius:14px;
      border:1px solid var(--line);
      background:var(--brand);
      color:#fff;
      font-weight:950;
      cursor:pointer;
    }
    .btn.secondary{ background:#fff; color:var(--brand); }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }

    .feedback{
      margin-top:12px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--line);
      display:none;
      font-weight:950;
      line-height:1.55;
      white-space:pre-line;
    }
    .feedback.ok{ display:block; background:#f0fdf4; color:#166534; border-color:#bbf7d0; }
    .feedback.no{ display:block; background:#fef2f2; color:#991b1b; border-color:#fecaca; }
    .feedback.info{ display:block; background:#eff6ff; color:#0b3a66; border-color:#bfdbfe; }

    /* ===== Sort (drag) ===== */
    .sortHint{
      font-size:13px;
      color:var(--muted);
      font-weight:850;
      line-height:1.45;
      margin-top:-4px;
    }
    .list{
      list-style:none;
      padding:0;
      margin:0;
      display:grid;
      gap:10px;
    }
    .item{
      border:1px solid var(--line);
      background:#ffffff;
      border-radius:16px;
      padding:12px 14px;
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:950;
      cursor:grab;
      user-select:none;
      touch-action:none;
    }
    .item:active{ cursor:grabbing; }
    .handle{
      width:34px; height:34px;
      border-radius:12px;
      border:1px solid var(--line);
      background:var(--soft);
      display:grid; place-items:center;
      font-weight:950;
      color:#0b2239;
      flex:0 0 auto;
    }
    .dragging{
      opacity:.7;
      outline: 3px solid rgba(147,197,253,.5);
    }

    /* ===== TF + Sentence bank ===== */
    .tfBox{
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px 14px;
      background:#ffffff;
      margin-top:10px;
    }
    .statement{
      font-weight:950;
      line-height:1.6;
    }
    .tfRow{
      display:flex;
      gap:10px;
      margin-top:10px;
      flex-wrap:wrap;
    }
    .tfBtn{
      flex:1;
      text-align:center;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#fff;
      font-weight:950;
      cursor:pointer;
      transition:.15s;
      user-select:none;
    }
    .tfBtn:hover{ border-color:#93c5fd; background:#f8fafc; }
    .tfBtn.active{
      border-color:#93c5fd;
      box-shadow:0 0 0 3px rgba(147,197,253,.35);
    }

    .bank{
      border:1px solid var(--line);
      background:#f8fafc;
      border-radius:16px;
      padding:12px 14px;
      margin-top:10px;
    }
    .bankHead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:8px;
    }
    .bankTitle{
      font-weight:950;
      color:var(--accent);
      line-height:1.3;
    }
    .bankHint{
      font-size:12px;
      font-weight:850;
      color:#315a7d;
      margin-top:4px;
      line-height:1.4;
    }
    .toggleBtn{
      border:1px solid var(--line);
      background:#fff;
      border-radius:12px;
      padding:10px 12px;
      font-weight:950;
      cursor:pointer;
    }

    .para{ margin:10px 0 0; }
    .sent{
      display:block;
      width:100%;
      text-align:left;
      border:1px solid var(--line);
      background:#ffffff;
      border-radius:14px;
      padding:10px 12px;
      font-weight:900;
      line-height:1.65;
      cursor:pointer;
      margin:8px 0;
    }
    .sent:hover{ border-color:#93c5fd; background:#f8fafc; }
    .sent.selected{
      border-color: var(--good);
      box-shadow: 0 0 0 3px rgba(22,163,74,.18);
    }

    .pickedBox{
      margin-top:10px;
      border:1px dashed rgba(88,127,161,.8);
      background:#ffffff;
      border-radius:14px;
      padding:10px 12px;
      font-weight:850;
      line-height:1.6;
      color:#0b2239;
      white-space:pre-line;
      min-height:44px;
    }
    .pickedLabel{
      margin-top:10px;
      font-size:13px;
      font-weight:900;
      color:var(--muted);
    }

    @media (max-width:600px){
      .wrap{ padding:14px; }
      .title{ font-size:24px; }
      .btn{ width:100%; }
      .tfBtn{ padding:16px 14px; font-size:18px; }
      .item{ padding:16px 14px; }
      .handle{ width:40px; height:40px; }
    }
  </style>
</head>

<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1 class="title">第四課・練習三：排序＋句意判斷</h1>
      <div class="subtitle">
        先閱讀短文，再完成：① 排序 ② 句意判斷（用文章句子當證據）。<br>
        <span style="font-size:13px; color:#35526e; font-weight:850;">
          Read first, then: (1) order events (2) judge meaning using evidence sentences.
        </span>
      </div>
    </div>
    <div class="stats">
      <span class="pill">分數 Score：<span id="score">0</span></span>
      <span class="pill">進度 Progress：<span id="progress">0/3</span></span>
    </div>
  </div>

  <div class="card" id="card"></div>
</div>

<script>
  // ✅ Correct passage (你提供的正確文本)
  const PASSAGE = `大雨下了好幾天，河水慢慢上升，村子開始被水淹沒。

這場災難讓大家非常不安，阿哲也是其中一個，但他沒有逃走。即使情況危險，他也選擇留下來幫忙。他答應村民，會盡力堵住破掉的地方。

經過長時間努力，水勢終於變小。於是大家開始清理村子。有人提出要重新建立家園，因為不想離開這個地方，大家決定讓這場災難成為新的開端。`;

  // 對錯答案（對錯也要算分）
  const TF1_CORRECT = false; // 阿哲一開始就不害怕 → 錯
  const TF2_CORRECT = false; // 村民只想離開不想重建 → 錯

  // 排序題（順序不變）
  const SORT_ITEMS = [
    { id:"water_small", text:"水勢變小" },
    { id:"village_flood", text:"村子被淹沒" },
    { id:"clean_up", text:"大家開始清理" },
    { id:"azhe_help", text:"阿哲留下來幫忙" }
  ];
  const SORT_ANSWER = ["village_flood","azhe_help","water_small","clean_up"];

  // helpers
  function escapeHTML(str){
    return (str ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#39;");
  }
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function splitPassageToParagraphSentences(text){
    const paras = text.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
    const sentenceRegex = /[^。！？!?]+[。！？!?]?/g;
    return paras.map(p=>{
      const sents = (p.match(sentenceRegex) || [])
        .map(s=>s.trim())
        .filter(s=>s.length>0);
      return sents;
    });
  }

  // ✅ 放寬語意檢查：支援「不想離開」「新的開端」
  function meaningSimilarTF2(selectedText){
    const patterns = [
      /重新建立|重建|建立家園|家園/,
      /不想離開|不要離開|想留在|留下來|留在/,
      /新的開端|新的開始|成為.*開端|成為.*開始/
    ];
    return patterns.some(p => p.test(selectedText));
  }

  // state
  let score = 0;
  let doneSort = false;
  let doneTF1 = false;
  let doneTF2 = false;

  const selectedMap = { tf1: new Set(), tf2: new Set() };
  const pickedTF = { tf1: null, tf2: null };

  const $card = document.getElementById("card");
  const $score = document.getElementById("score");
  const $progress = document.getElementById("progress");

  function setHUD(){
    const doneCount = (doneSort?1:0) + (doneTF1?1:0) + (doneTF2?1:0);
    $score.textContent = String(score);
    $progress.textContent = `${doneCount}/3`;
  }

  function render(){
    score = 0;
    doneSort = false;
    doneTF1 = false;
    doneTF2 = false;
    selectedMap.tf1.clear(); selectedMap.tf2.clear();
    pickedTF.tf1 = null; pickedTF.tf2 = null;
    setHUD();

    const passageParas = splitPassageToParagraphSentences(PASSAGE);
    const sortDeck = shuffle(SORT_ITEMS);

    $card.innerHTML = `
      <div class="blockTitle">閱讀短文 Reading</div>
      <div class="passage">${escapeHTML(PASSAGE)}</div>

      <div class="divider"></div>

      <div class="blockTitle">① 排序題：依照發生順序排列</div>
      <div class="sortHint">
        你可以拖曳排序（手機可長按拖）。完成後按「檢查排序」。<br>
        <span style="font-size:12px; color:#315a7d;">Drag to reorder. Long-press on mobile. Then click “Check Order”.</span>
      </div>

      <ol class="list" id="sortList">
        ${sortDeck.map(it=>`
          <li class="item" draggable="true" data-id="${it.id}">
            <span class="handle">≡</span>
            <span>${escapeHTML(it.text)}</span>
          </li>
        `).join("")}
      </ol>

      <div class="row" style="margin-top:10px;">
        <button class="btn secondary" id="sortReshuffle">重新打亂 Reshuffle</button>
        <button class="btn" id="sortCheck">檢查排序 Check Order</button>
      </div>
      <div id="sortFb" class="feedback"></div>

      <div class="divider"></div>

      <div class="blockTitle">② 句意判斷 1</div>
      ${renderTFBox("tf1",
        "阿哲一開始就不害怕。",
        "A-Zhe was not afraid from the beginning.",
        "通過條件：對/錯要選對 + 必須選至少一句文章句子作為證據。",
        "Pass: correct True/False + select at least one evidence sentence."
      )}

      <div class="divider"></div>

      <div class="blockTitle">③ 句意判斷 2</div>
      ${renderTFBox("tf2",
        "村民只想離開，不想重建。",
        "The villagers only wanted to leave and did not want to rebuild.",
        "通過條件：對/錯要選對 + 證據句意思相近即可（放寬）。",
        "Pass: correct True/False + evidence meaning is similar (lenient)."
      )}

      <div class="divider"></div>

      <div class="row">
        <button class="btn secondary" id="restartBtn">再做一次 Restart</button>
      </div>
    `;

    setupSortDnD();
    document.getElementById("sortReshuffle").onclick = render;
    document.getElementById("sortCheck").onclick = checkSort;

    renderSentenceBanks(passageParas);
    setupTFButtons();
    setupBankControls();
    setupTFChecks();

    document.getElementById("restartBtn").onclick = render;
  }

  function renderTFBox(qid, zh, en, ruleZh, ruleEn){
    return `
      <div class="tfBox" data-qid="${qid}">
        <div class="statement">
          ${escapeHTML(zh)}
          <div style="font-size:12px; font-weight:850; color:#315a7d; margin-top:4px;">
            ${escapeHTML(en)}
          </div>
        </div>

        <div class="tfRow" aria-label="true false">
          <button class="tfBtn" type="button" data-qid="${qid}" data-val="true">對 ✓<div style="font-size:12px; font-weight:850; color:#315a7d; margin-top:4px;">True</div></button>
          <button class="tfBtn" type="button" data-qid="${qid}" data-val="false">錯 ✗<div style="font-size:12px; font-weight:850; color:#315a7d; margin-top:4px;">False</div></button>
        </div>

        <div class="bank">
          <div class="bankHead">
            <div>
              <div class="bankTitle">文章句子（點選當證據）</div>
              <div class="bankHint">Click sentences as evidence. Selected ones will appear below.</div>
            </div>
            <button class="toggleBtn" type="button" data-toggle="${qid}">收起 Hide</button>
          </div>

          <div class="bankBody" id="bankBody-${qid}"></div>

          <div class="pickedLabel">
            已選證據（可多選）：
            <span style="font-size:12px; color:#315a7d; font-weight:850;">Selected evidence (multiple allowed).</span>
          </div>
          <div class="pickedBox" id="picked-${qid}">（尚未選取）</div>
        </div>

        <div class="row" style="margin-top:10px;">
          <button class="btn secondary" type="button" data-clear="${qid}">清空選取 Clear</button>
          <button class="btn" type="button" data-check="${qid}">檢查 Check</button>
        </div>

        <div class="feedback info" style="display:block; margin-top:10px;">
          <b>規則 Rules：</b>${escapeHTML(ruleZh)}<br>
          <span style="font-size:12px; font-weight:850;">${escapeHTML(ruleEn)}</span>
        </div>

        <div class="feedback" id="fb-${qid}"></div>
      </div>
    `;
  }

  // Sort DnD
  function setupSortDnD(){
    const list = document.getElementById("sortList");
    let draggingEl = null;

    list.addEventListener("dragstart", (e)=>{
      const li = e.target.closest(".item");
      if(!li) return;
      draggingEl = li;
      li.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", li.dataset.id);
    });

    list.addEventListener("dragend", (e)=>{
      const li = e.target.closest(".item");
      if(li) li.classList.remove("dragging");
      draggingEl = null;
    });

    list.addEventListener("dragover", (e)=>{
      e.preventDefault();
      const over = e.target.closest(".item");
      if(!over || !draggingEl || over === draggingEl) return;

      const rect = over.getBoundingClientRect();
      const after = (e.clientY - rect.top) > rect.height / 2;
      if(after) over.after(draggingEl);
      else over.before(draggingEl);
    });

    // touch
    let touchDragging = null;

    list.addEventListener("touchstart", (e)=>{
      const li = e.target.closest(".item");
      if(!li) return;
      touchDragging = li;
      li.classList.add("dragging");
    }, {passive:true});

    list.addEventListener("touchmove", (e)=>{
      if(!touchDragging) return;
      const touch = e.touches[0];
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      const over = el ? el.closest(".item") : null;
      if(!over || over === touchDragging) return;

      const rect = over.getBoundingClientRect();
      const after = (touch.clientY - rect.top) > rect.height / 2;
      if(after) over.after(touchDragging);
      else over.before(touchDragging);
    }, {passive:true});

    list.addEventListener("touchend", ()=>{
      if(touchDragging) touchDragging.classList.remove("dragging");
      touchDragging = null;
    });
  }

  function getSortOrder(){
    return Array.from(document.querySelectorAll("#sortList .item")).map(li => li.dataset.id);
  }

  function checkSort(){
    const fb = document.getElementById("sortFb");
    const order = getSortOrder();
    const ok = order.join("|") === SORT_ANSWER.join("|");

    if(ok){
      if(!doneSort){
        score += 1;
        doneSort = true;
        setHUD();
      }
      fb.className = "feedback ok";
      fb.textContent =
        "✅ 排序正確！\n\n正確順序：\n1. 村子被淹沒 → 2. 阿哲留下來幫忙 → 3. 水勢變小 → 4. 大家開始清理";
    }else{
      fb.className = "feedback no";
      fb.textContent =
        "❌ 還不正確，再試一次。\n提示：最先是「村子開始被水淹沒」，最後才是「大家開始清理」。";
    }
  }

  // Banks
  function renderSentenceBanks(passageParas){
    ["tf1","tf2"].forEach(qid=>{
      const body = document.getElementById(`bankBody-${qid}`);
      body.innerHTML = passageParas.map((para)=>`
        <div class="para">
          ${para.map(sent=>`
            <button type="button" class="sent" data-qid="${qid}">
              ${escapeHTML(sent)}
            </button>
          `).join("")}
        </div>
      `).join("");

      body.querySelectorAll(".sent").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const text = btn.textContent.trim();
          if(selectedMap[qid].has(text)){
            selectedMap[qid].delete(text);
            btn.classList.remove("selected");
          }else{
            selectedMap[qid].add(text);
            btn.classList.add("selected");
          }
          updatePickedBox(qid);
        });
      });

      updatePickedBox(qid);
    });
  }

  function updatePickedBox(qid){
    const el = document.getElementById(`picked-${qid}`);
    const arr = Array.from(selectedMap[qid]);
    el.textContent = arr.length ? arr.join("\n") : "（尚未選取）";
  }

  function setupTFButtons(){
    document.querySelectorAll(".tfBtn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const qid = btn.dataset.qid;
        const box = document.querySelector(`.tfBox[data-qid="${qid}"]`);
        box.querySelectorAll(".tfBtn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        pickedTF[qid] = (btn.dataset.val === "true");
      });
    });
  }

  function setupBankControls(){
    document.querySelectorAll(".toggleBtn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const qid = btn.dataset.toggle;
        const body = document.getElementById(`bankBody-${qid}`);
        const hidden = body.style.display === "none";
        body.style.display = hidden ? "block" : "none";
        btn.textContent = hidden ? "收起 Hide" : "展開 Show";
      });
    });

    document.querySelectorAll("[data-clear]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const qid = btn.dataset.clear;
        selectedMap[qid].clear();
        document.querySelectorAll(`#bankBody-${qid} .sent`).forEach(s=>s.classList.remove("selected"));
        updatePickedBox(qid);
      });
    });
  }

  function setupTFChecks(){
    document.querySelectorAll("[data-check]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const qid = btn.dataset.check;
        if(qid === "tf1") checkTF1();
        if(qid === "tf2") checkTF2();
      });
    });
  }

  function checkTF1(){
    const fb = document.getElementById("fb-tf1");
    const selected = Array.from(selectedMap.tf1);
    const choice = pickedTF.tf1;

    if(choice === null){
      fb.className = "feedback no";
      fb.textContent = "❌ 請先選擇「對」或「錯」。";
      return;
    }
    if(selected.length === 0){
      fb.className = "feedback no";
      fb.textContent = "❌ 請先選取至少一句文章句子作為證據。";
      return;
    }
    if(choice !== TF1_CORRECT){
      fb.className = "feedback no";
      fb.textContent =
        "❌ 判斷不正確。\n提示：文章說阿哲也『非常不安』，但他沒有逃走。";
      return;
    }

    if(!doneTF1){
      score += 1;
      doneTF1 = true;
      setHUD();
    }
    fb.className = "feedback ok";
    fb.textContent = "✅ 正確！對錯判斷正確，而且你有提供文章證據。";
  }

  function checkTF2(){
    const fb = document.getElementById("fb-tf2");
    const selected = Array.from(selectedMap.tf2);
    const choice = pickedTF.tf2;

    if(choice === null){
      fb.className = "feedback no";
      fb.textContent = "❌ 請先選擇「對」或「錯」。";
      return;
    }
    if(selected.length === 0){
      fb.className = "feedback no";
      fb.textContent = "❌ 請先選取至少一句文章句子作為證據。";
      return;
    }
    if(choice !== TF2_CORRECT){
      fb.className = "feedback no";
      fb.textContent =
        "❌ 判斷不正確。\n提示：文章提到『重新建立家園』與『新的開端』。";
      return;
    }

    const merged = selected.join(" ");
    const passMeaning = meaningSimilarTF2(merged);

    if(!passMeaning){
      fb.className = "feedback no";
      fb.textContent =
        "❌ 證據句與題目意思關聯不夠。\n提示：找與「重建／不想離開／新的開端」相關的句子。";
      return;
    }

    if(!doneTF2){
      score += 1;
      doneTF2 = true;
      setHUD();
    }
    fb.className = "feedback ok";
    fb.textContent = "✅ 正確！你判斷對錯正確，而且證據句意思也符合文章。";
  }

  // init
  render();
</script>
</body>
</html>
